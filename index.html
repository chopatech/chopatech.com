<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPO Payments Demo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">DPO<span>Store</span></div>
    </header>

    <main class="hero">
      <h1>Sample Product</h1>
      <p class="muted">A demo item to test the DPO Pay checkout flow end to end.</p>

      <div class="product-card">
        <div class="product-row">
          <span>Widget (1x)</span>
          <span>TZS 50,000</span>
        </div>
        <div class="product-row total">
          <span>Total</span>
          <span>TZS 50,000</span>
        </div>
        <a class="btn btn-primary" href="checkout.html">Proceed to Checkout</a>
      </div>
    </main>

    <footer class="site-footer">
      <p class="muted small">Secured by DPO Pay · Cloudflare Workers</p>
    </footer>
  </div>
</body>
</html>
