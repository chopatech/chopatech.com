<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — DPO Payments Demo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">DPO<span>Store</span></div>
    </header>

    <main class="checkout">
      <h1>Checkout</h1>
      <p class="muted">You'll be redirected to DPO's secure payment page to enter your card details.</p>

      <form id="checkout-form" class="card-form">
        <div class="field-group">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="field-group">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+255 7XX XXX XXX">
        </div>

        <div class="order-summary">
          <div class="product-row">
            <span>Widget (1x)</span>
            <span>TZS 50,000</span>
          </div>
          <div class="product-row total">
            <span>Total</span>
            <span>TZS 50,000</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="pay-btn">
          Pay with Visa / Mastercard
        </button>

        <p id="form-error" class="error-text" hidden></p>
      </form>
    </main>

    <footer class="site-footer">
      <p class="muted small">Secured by DPO Pay · Cloudflare Workers</p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
