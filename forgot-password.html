<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset password — CHOPA TECH</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="js/three-bg.js" defer></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand-mark"><div class="dot">CT</div> CHOPA TECH</div>
    <div><div class="headline" id="fpHeadline">Forgot your password?</div><p class="sub" id="fpSub">We'll email you a secure reset link. It expires in 30 minutes.</p></div>
    <div></div>
  </div>
  <div class="auth-panel">
    <button id="authLangBtn" class="btn-icon" style="position:absolute; top:24px; right:24px; width:auto; padding:8px 12px; font-family:var(--font-mono); font-size:11px; font-weight:600;">EN</button>
    <div class="auth-card">
      <h1 id="lblResetTitle">Reset password</h1>
      <p class="lead" id="lblResetLead">Enter the email linked to your account.</p>
      <div class="form-error" id="fpError"></div>
      <div id="fpSuccess" style="display:none;background:var(--green-dim);border:1px solid rgba(56,185,120,.35);color:#a6e8c4;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:16px">
        <span id="lblResetSuccess">If that email exists, a reset link has been sent.</span>
      </div>
      <form id="fpForm">
        <div class="field"><label id="lblEmail">Email</label><input id="fpEmail" type="email" required placeholder="you@chopatech.co.tz"/></div>
        <button class="btn btn-primary btn-block" type="submit" id="fpBtn">Send reset link</button>
      </form>
      <p class="auth-foot"><a href="login.html" id="lblBackToSignIn">Back to sign in</a></p>
    </div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
(function(){
  const map = {
    fpHeadline: "forgot_headline", fpSub: "forgot_sub",
    lblResetTitle: "reset_password_title", lblResetLead: "reset_password_lead",
    lblResetSuccess: "reset_success_msg", lblEmail: "label_email",
    lblBackToSignIn: "back_to_sign_in",
  };
  for (const [id, key] of Object.entries(map)) { const el = document.getElementById(id); if (el) el.textContent = t(key); }
  document.getElementById("fpBtn").textContent = t("send_reset_link");
  document.getElementById("authLangBtn").textContent = getLang().toUpperCase();
  document.getElementById("authLangBtn").addEventListener("click", () => setLanguage(getLang() === "en" ? "sw" : "en"));
})();

document.getElementById("fpForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("fpBtn");
  btn.disabled = true; btn.textContent = t("sending");
  try { await Api.forgotPassword(document.getElementById("fpEmail").value); } catch (err) {}
  document.getElementById("fpSuccess").style.display = "block";
  document.getElementById("fpForm").style.display = "none";
  btn.disabled = false; btn.textContent = t("send_reset_link");
});
</script>
</body>
</html>
