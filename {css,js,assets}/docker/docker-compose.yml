version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chopa
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: chopa_tech
    volumes:
      - chopa_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    image: halverneus/static-file-server:latest
    restart: unless-stopped
    environment:
      FOLDER: /web
    volumes:
      - ../frontend:/web
    ports:
      - "5173:8080"

volumes:
  chopa_db_data:
